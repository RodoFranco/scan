<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ESCÁNER DE ACCESO - EVENTO 2026</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f7;color:#172033;min-height:100vh;padding:16px}.card{width:100%;max-width:520px;margin:0 auto;background:#fff;border-radius:18px;padding:18px;box-shadow:0 8px 30px #0002}h1{text-align:center;font-size:24px;margin:4px 0 8px}.sub{text-align:center;color:#667085;font-size:14px;margin:0 0 16px}.btn{width:100%;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:800;cursor:pointer;background:#1769e0;color:#fff;margin-top:12px}.btn.secondary{background:#475467}.status{text-align:center;border-radius:12px;padding:13px;margin-top:14px;font-weight:700;background:#f2f4f7}.status.ok{background:#dcfce7;color:#166534}.status.err{background:#fee2e2;color:#991b1b}.result{display:none;margin-top:16px;padding:18px;border-radius:14px;text-align:center;background:#f8fafc}.result h2{margin:0 0 8px}.result p{margin:5px 0}.small{font-size:12px;color:#667085;text-align:center;margin-top:14px;line-height:1.4}#reader{width:100%;overflow:hidden;border-radius:14px;margin-top:10px}#reader video{border-radius:14px}.hidden{display:none!important}</style>
</head>
<body>
<div class="card">
<h1>ESCÁNER DE ACCESO</h1>
<p class="sub">EVENTO 2026</p>
<div id="reader"></div>
<div id="status" class="status">Presione ESCANEAR QR para activar la cámara.</div>
<button id="startBtn" class="btn" onclick="startScanner()">ESCANEAR QR</button>
<button id="stopBtn" class="btn secondary hidden" onclick="stopScanner()">DETENER ESCÁNER</button>
<div id="result" class="result"></div>
<p class="small">Al leer un QR válido, el sistema abrirá el enlace seguro de acceso y registrará el ingreso en Google Sheets.</p>
</div>
<script>
let scanner=null;
let running=false;
let lastText='';
let busy=false;
const statusEl=document.getElementById('status');
const resultEl=document.getElementById('result');
const startBtn=document.getElementById('startBtn');
const stopBtn=document.getElementById('stopBtn');
function status(t,type){statusEl.textContent=t;statusEl.className='status'+(type?' '+type:'')}
function startScanner(){
  if(running)return;
  resultEl.style.display='none';
  status('Solicitando acceso a la cámara...');
  scanner=new Html5Qrcode('reader');
  scanner.start({facingMode:{exact:'environment'}},{fps:10,qrbox:{width:260,height:260}},onScanSuccess,()=>{})
  .then(()=>{running=true;startBtn.classList.add('hidden');stopBtn.classList.remove('hidden');status('CÁMARA ACTIVA — APUNTE AL QR');})
  .catch(()=>{
    scanner=null;
    status('No se pudo abrir la cámara. Revise el permiso de cámara y use HTTPS.', 'err');
  });
}
function stopScanner(){
  if(!scanner){return}
  scanner.stop().then(()=>{try{scanner.clear()}catch(e){};scanner=null;running=false;startBtn.classList.remove('hidden');stopBtn.classList.add('hidden');status('Escáner detenido.');}).catch(()=>{});
}
function onScanSuccess(decodedText){
  if(busy || decodedText===lastText)return;
  lastText=decodedText;busy=true;
  status('QR DETECTADO — VALIDANDO...');
  resultEl.innerHTML='<h2>QR DETECTADO</h2><p>Validando autorización y registrando ingreso...</p>';
  resultEl.style.display='block';
  if(running && scanner){scanner.stop().then(()=>{try{scanner.clear()}catch(e){};running=false;}).catch(()=>{});}
  startBtn.classList.remove('hidden');stopBtn.classList.add('hidden');
  // El QR generado por Apps Script ya contiene el enlace seguro de check-in.
  // Al abrirlo, Code.gs valida el token y registra el ingreso en Google Sheets.
  if(/^https?:\/\//i.test(decodedText)){
    window.location.href=decodedText;
  }else{
    busy=false;status('QR no válido: no contiene un enlace.', 'err');
  }
}
</script>
</body>
</html>
