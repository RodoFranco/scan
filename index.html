<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ESCÁNER DE ACCESO - EVENTO 2026</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f7;color:#172033;min-height:100vh;padding:16px}.card{width:100%;max-width:520px;margin:0 auto;background:#fff;border-radius:18px;padding:18px;box-shadow:0 8px 30px #0002}h1{text-align:center;font-size:24px;margin:4px 0 8px}.sub{text-align:center;color:#667085;font-size:14px;margin:0 0 16px}.btn{width:100%;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:800;cursor:pointer;background:#1769e0;color:#fff;margin-top:12px}.btn.secondary{background:#475467}.status{text-align:center;border-radius:12px;padding:13px;margin-top:14px;font-weight:700;background:#f2f4f7}.status.ok{background:#dcfce7;color:#166534}.status.err{background:#fee2e2;color:#991b1b}.result{display:none;margin-top:16px;padding:18px;border-radius:14px;text-align:center;background:#f8fafc}.result h2{margin:0 0 8px}.result p{margin:5px 0}.small{font-size:12px;color:#667085;text-align:center;margin-top:14px;line-height:1.4}#reader{width:100%;overflow:hidden;border-radius:14px;margin-top:10px}#reader video{border-radius:14px}.hidden{display:none!important}</style>
</head>
<body>
<div class="card">
<h1>ESCÁNER DE ACCESO</h1>
<p class="sub">EVENTO 2026</p>
<div id="reader"></div>
<div id="status" class="status">Presione ESCANEAR QR para activar la cámara.</div>
<button id="startBtn" class="btn" onclick="startScanner()">ESCANEAR QR</button>
<button id="stopBtn" class="btn secondary hidden" onclick="stopScanner()">DETENER ESCÁNER</button>
<div id="result" class="result"></div>
<p class="small">Al leer un QR válido, el sistema abrirá el enlace seguro de acceso y registrará el ingreso en Google Sheets.</p>
</div>
<script>
let scanner=null, running=false, lastText='', busy=false;
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbza0qWrhpg38dAAivIzfqhoZmkn-CqJHDkXDnTmrPsAi8hn4_kUhdfI5luFGmw-n45x/exec';
const statusEl=document.getElementById('status');
const resultEl=document.getElementById('result');
const startBtn=document.getElementById('startBtn');
const stopBtn=document.getElementById('stopBtn');
function status(t,type){statusEl.textContent=t;statusEl.className='status'+(type?' '+type:'')}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function startScanner(){
  if(running)return;
  resultEl.style.display='none'; busy=false;
  status('SOLICITANDO ACCESO A LA CÁMARA...');
  scanner=new Html5Qrcode('reader');
  scanner.start({facingMode:{exact:'environment'}},{fps:10,qrbox:{width:260,height:260}},onScanSuccess,()=>{})
  .then(()=>{running=true;startBtn.classList.add('hidden');stopBtn.classList.remove('hidden');status('CÁMARA ACTIVA — APUNTE AL QR');})
  .catch(()=>{scanner=null;status('NO SE PUDO ABRIR LA CÁMARA. REVISE EL PERMISO Y USE HTTPS.','err');});
}
function stopScanner(){
  if(!scanner)return;
  scanner.stop().then(()=>{try{scanner.clear()}catch(e){};scanner=null;running=false;startBtn.classList.remove('hidden');stopBtn.classList.add('hidden');status('ESCÁNER DETENIDO.');}).catch(()=>{});
}
function onScanSuccess(decodedText){
  if(busy || decodedText===lastText)return;
  lastText=decodedText; busy=true;
  status('QR DETECTADO — VALIDANDO...');
  resultEl.innerHTML='<h2>QR DETECTADO</h2><p>VALIDANDO AUTORIZACIÓN...</p>'; resultEl.style.display='block';
  if(scanner){scanner.stop().then(()=>{try{scanner.clear()}catch(e){};scanner=null;running=false;startBtn.classList.remove('hidden');stopBtn.classList.add('hidden');}).catch(()=>{});}

  let u;
  try{u=new URL(decodedText);}catch(e){showResult({ok:false,code:'INVALIDO',mensaje:'QR INVÁLIDO: NO CONTIENE UN ENLACE VÁLIDO.'});return;}
  const id=u.searchParams.get('id');
  const token=u.searchParams.get('token');
  if(!id||!token){showResult({ok:false,code:'INVALIDO',mensaje:'QR INVÁLIDO: FALTAN DATOS DE ACCESO.'});return;}

  const cb='qrResult_'+Date.now();
  window[cb]=function(data){
    try{delete window[cb]}catch(e){}
    const tag=document.getElementById(cb); if(tag) tag.remove();
    showResult(data);
  };
  const tag=document.createElement('script'); tag.id=cb;
  tag.src=APPS_SCRIPT_URL+'?page=scanapi&id='+encodeURIComponent(id)+'&token='+encodeURIComponent(token)+'&callback='+encodeURIComponent(cb)+'&_='+Date.now();
  tag.onerror=function(){try{delete window[cb]}catch(e){};tag.remove();showResult({ok:false,code:'ERROR_RED',mensaje:'NO FUE POSIBLE COMUNICARSE CON EL SERVIDOR. REVISE INTERNET.'});};
  document.body.appendChild(tag);
}
function showResult(data){
  busy=false;
  const ok=!!data.ok;
  status(data.mensaje || (ok?'ACCESO AUTORIZADO':'ACCESO NO AUTORIZADO'),ok?'ok':'err');
  let title=ok?'✓ ACCESO AUTORIZADO':(data.code==='YA_INGRESADO'?'⚠ QR YA UTILIZADO':'✕ '+(data.mensaje||'QR INVÁLIDO'));
  resultEl.innerHTML='<h2>'+escapeHtml(title)+'</h2>'+
    (data.nombre?'<p><b>'+escapeHtml(data.nombre)+'</b></p>':'')+
    (data.empresa?'<p>'+escapeHtml(data.empresa)+'</p>':'')+
    (data.tipo?'<p><b>'+escapeHtml(data.tipo)+'</b></p>':'')+
    (data.id?'<p>ID: '+escapeHtml(data.id)+'</p>':'')+
    '<p>'+escapeHtml(data.mensaje||'')+'</p>';
  resultEl.style.display='block';
  // Preparar inmediatamente el siguiente escaneo.
  setTimeout(()=>{lastText='';status('LISTO PARA EL SIGUIENTE ESCANEO.');startScanner();},1800);
}
</script>
</body>
</html>
